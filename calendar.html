<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級行事曆</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* Body 背景透明 */
        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
            padding: 20px;
            background-color: transparent;
            margin: 0;
            color: #243447;
        }
        
        /* 容器背景透明 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: transparent;
            padding: 25px;
            width: 100%;
            border-radius: 12px;
            box-shadow: none;
        }
        
        /* 控制列 (保留淺灰底色) */
        .controls { background: #eef2f6; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; border-left: 5px solid #4285f4;}
        .date-nav, .view-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .view-controls { margin-left: auto; }
        
        button { min-height: 42px; padding: 8px 14px; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
        select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; cursor: pointer;}
        
        .btn-sec { background-color: #fff; border: 1px solid #ccc; color: #555; }
        .btn-sec:hover { background-color: #f0f0f0; }

        .btn-active { background-color: #333; color: white; border: 1px solid #333; }

        /* --- 修改處：標題區塊增加背景色與圓角 --- */
        .header-title { 
            text-align: center; 
            margin: 10px 0 20px 0; 
            color: #2c3e50; 
            font-size: 1.8em; 
            font-weight: bold; 
            
            /* 新增樣式：讓它像按鈕區一樣有背景 */
            background-color: #eef2f6; 
            padding: 15px;
            border-radius: 8px;
            border-bottom: 3px solid #ddd; /* 底部加強一點立體感 */
        }
        
        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; }
        
        th:nth-child(1) { width: 160px; }  
        th:nth-child(2) { width: 35%; }    
        th:nth-child(3) { width: auto; }   

        th { background-color: #4285f4; color: white; padding: 15px; text-align: center; font-size: 1.1em; border: 1px solid #3367d6; }
        
        /* 表格內容保留白底 (半透明) 以利閱讀 */
        td { padding: 15px; border: 1px solid #ccc; vertical-align: middle; word-wrap: break-word; line-height: 1.6; background-color: rgba(255, 255, 255, 0.95); }
        
        tr:nth-child(even) td { background-color: #f9f9f9; } 
        tr:hover td { background-color: #e8f0fe; } 

        .col-date { font-weight: bold; color: #d32f2f; text-align: center; background-color: #fff8e1 !important; }
        .col-title { font-weight: bold; color: #1a237e; }
        .col-desc { color: #444; }

        .status-box { padding: 40px; text-align: center; color: #666; background: rgba(250, 250, 250, 0.9); border: 1px dashed #ccc; font-size: 1.2em; border-radius: 8px;}
        .error-msg { color: red; background: #ffebee; border: 1px solid #ef5350; }

        .font-normal { font-size: 16px; }
        .font-large { font-size: 20px; }
        .font-xl { font-size: 24px; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            padding: 20px;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
        }
        .modal.is-open { display: flex; }
        .modal-content {
            width: min(420px, 100%);
            padding: 24px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25);
        }
        .modal-header { margin-bottom: 16px; color: #243447; font-size: 1.25em; font-weight: 700; }
        .date-field { display: grid; gap: 6px; margin-top: 12px; font-weight: 700; }
        .date-field input { width: 100%; min-height: 44px; padding: 9px 10px; border: 1px solid #b8c2cc; border-radius: 6px; font: inherit; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: #4285f4; color: #fff; font-weight: 700; }
        .btn-primary:hover { background: #3367d6; }
        .field-error { min-height: 1.4em; margin-top: 10px; color: #c62828; font-size: 0.92em; }

        @media (max-width: 820px) {
            body { padding: 10px; }
            .container { padding: 12px; }
            .controls { display: grid; gap: 10px; padding: 12px; }
            .date-nav, .view-controls { width: 100%; margin: 0; }
            .date-nav { display: grid; grid-template-columns: auto auto auto minmax(130px, 1fr); }
            .date-nav select { width: 100%; min-height: 42px; }
            .view-controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .header-title { margin: 8px 0 12px; padding: 12px; font-size: 1.35em; }
        }

        @media (max-width: 640px) {
            body { padding: 6px; }
            .container { padding: 6px; }
            .controls { border-left-width: 4px; }
            button { min-height: 44px; padding: 8px 6px; font-size: 14px; }
            .date-nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .date-nav select { grid-column: 1 / -1; }
            .view-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .header-title { font-size: 1.15em; line-height: 1.4; }

            table, tbody, tr, td { display: block; width: 100%; }
            table { margin-top: 8px; }
            thead { display: none; }
            tbody { display: grid; gap: 10px; }
            tr { overflow: hidden; border: 1px solid #ccd6e0; border-radius: 10px; background: rgba(255, 255, 255, 0.97); box-shadow: 0 3px 10px rgba(36, 52, 71, 0.06); }
            td { padding: 9px 12px; border: 0; border-bottom: 1px solid #e7ecf1; line-height: 1.45; }
            td:last-child { border-bottom: 0; }
            tr:nth-child(even) td, tr:hover td { background-color: transparent; }
            .col-date { padding: 9px 12px; text-align: left; background-color: #fff8e1 !important; }
            .col-title { padding-top: 11px; font-size: 1.05em; }
            .col-desc:empty { display: none; }
            .font-normal { font-size: 14px; }
            .font-large { font-size: 16px; }
            .font-xl { font-size: 18px; }
            .status-box { padding: 28px 14px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div class="date-nav">
            <button class="btn-sec" onclick="shiftDate(-1)">❮ 上一頁</button>
            <button class="btn-sec" onclick="shiftDate(1)">下一頁 ❯</button>
            <button class="btn-sec" onclick="goToToday()">今天</button>
            <select id="fontSizeSelect" onchange="updateFontSize()">
                <option value="font-normal">字體：中</option>
                <option value="font-large" selected>字體：大</option>
                <option value="font-xl">字體：特大</option>
            </select>
        </div>

        <div class="view-controls">
            <button id="btnTenDays" class="btn-sec btn-active" onclick="switchView('tenDays')">10天</button>
            <button id="btnWeek" class="btn-sec" onclick="switchView('week')">週</button>
            <button id="btnMonth" class="btn-sec" onclick="switchView('month')">月</button>
            <button id="btnCustom" class="btn-sec" onclick="openDateModal()">自訂範圍</button>
        </div>
    </div>

    <div class="header-title" id="displayTitle">...</div>

    <div id="contentArea">
        <div class="status-box">系統初始化中...</div>
    </div>
</div>

<div id="dateModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dateModalTitle">
    <div class="modal-content">
        <div class="modal-header" id="dateModalTitle">自訂顯示日期範圍</div>
        <label class="date-field">
            開始日期
            <input type="date" id="customStart" value="2026-08-01">
        </label>
        <label class="date-field">
            結束日期
            <input type="date" id="customEnd" value="2028-06-30">
        </label>
        <div id="dateRangeError" class="field-error" aria-live="polite"></div>
        <div class="modal-actions">
            <button class="btn-sec" onclick="closeDateModal()">取消</button>
            <button class="btn-primary" onclick="applyCustomRange()">讀取活動</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ⚠️⚠️⚠️ 請在下方雙引號 "" 之間貼上 GAS 網址 ⚠️⚠️⚠️
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwgdGjtsqNQYywpAUp3aGKx4pp0Q0P1m4LJ3MCWJmAXwWRAP8R6vZgRjlGYPoNx0yPF/exec"; 
    // ============================================================

    let allEvents = [];
    let currentViewDate = new Date();
    let viewMode = 'tenDays';
    let requestSequence = 0;
    let customRangeStart = new Date(2026, 7, 1);
    let customRangeEnd = new Date(2028, 5, 30, 23, 59, 59, 999);
    
    const weekDays = ["日", "一", "二", "三", "四", "五", "六"];

    window.onload = function() {
        if (typeof GAS_API_URL === 'undefined' || !GAS_API_URL) {
            showError("嚴重錯誤：GAS_API_URL 未設定。");
            return;
        }
        loadCurrentView();
    };

    async function loadCurrentView() {
        const box = document.getElementById('contentArea');
        const range = getViewRange();
        const requestId = ++requestSequence;

        updateBtnStyle();
        document.getElementById('displayTitle').innerText = range.title;
        box.innerHTML = '<div class="status-box" style="color:#4285f4;">正在連線讀取資料，請稍候...</div>';

        try {
            const url = `${GAS_API_URL}?start=${formatDateParam(range.start)}&end=${formatDateParam(range.end)}`;
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const json = await response.json();
            if (requestId !== requestSequence) return;
            if (json.status !== 'success') throw new Error(json.message || '後端回傳錯誤');

            allEvents = Array.isArray(json.data) ? json.data : [];
            renderView();
        } catch (error) {
            if (requestId !== requestSequence) return;
            console.error(error);
            showError("連線失敗，請稍後再試。");
        }
    }

    function getViewRange() {
        let start, end, title;
        if (viewMode === 'tenDays') {
            start = new Date(currentViewDate);
            start.setHours(0, 0, 0, 0);
            end = new Date(start);
            end.setDate(start.getDate() + 9);
            end.setHours(23, 59, 59, 999);
            title = `${formatDateSimple(start)} - ${formatDateSimple(end)} (10天)`;
        } else if (viewMode === 'week') {
            const day = currentViewDate.getDay();
            start = new Date(currentViewDate);
            start.setDate(currentViewDate.getDate() - day);
            start.setHours(0, 0, 0, 0);
            end = new Date(start);
            end.setDate(start.getDate() + 6);
            end.setHours(23, 59, 59, 999);
            title = `${formatDateSimple(start)} - ${formatDateSimple(end)} (週)`;
        } else if (viewMode === 'month') {
            start = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth(), 1);
            end = new Date(currentViewDate.getFullYear(), currentViewDate.getMonth() + 1, 0, 23, 59, 59, 999);
            title = `${currentViewDate.getFullYear()} 年 ${currentViewDate.getMonth() + 1} 月`;
        } else {
            start = new Date(customRangeStart);
            end = new Date(customRangeEnd);
            title = `${formatDateFull(start)}－${formatDateFull(end)}（自訂範圍）`;
        }
        return { start, end, title };
    }

    function renderView() {
        const range = getViewRange();
        updateBtnStyle();
        document.getElementById('displayTitle').innerText = range.title;

        const filtered = allEvents.filter(evt => {
            const date = parseDate(evt.start);
            if (!date || isNaN(date.getTime())) return false;
            return date >= range.start && date <= range.end;
        });

        filtered.sort((a, b) => parseDate(a.start) - parseDate(b.start));

        const currentFontSize = document.getElementById('fontSizeSelect').value;

        if (filtered.length === 0) {
            document.getElementById('contentArea').innerHTML = '<div class="status-box">本期間無活動<br><small>請切換上一頁/下一頁</small></div>';
            return;
        }

        let html = `<table class="${currentFontSize}"><thead><tr><th>日期</th><th>活動標題</th><th>說明</th></tr></thead><tbody>`;
        
        filtered.forEach(evt => {
            const dateObj = parseDate(evt.start);
            const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            const day = dateObj.getDate().toString().padStart(2, '0');
            const dayChar = weekDays[dateObj.getDay()];
            const dateString = `${month}/${day}(${dayChar})`;

            html += `
                <tr>
                    <td class="col-date">${dateString}</td>
                    <td class="col-title">${escapeHtml(evt.title)}</td>
                    <td class="col-desc">${escapeHtml(evt.desc)}</td>
                </tr>
            `;
        });
        html += '</tbody></table>';
        document.getElementById('contentArea').innerHTML = html;
    }

    function parseDate(dateStr) {
        if (!dateStr) return null;
        if (dateStr.indexOf('T') !== -1) return new Date(dateStr);
        const match = String(dateStr).match(/^(\d{4})[/-](\d{2})[/-](\d{2})(?:\s+(\d{2}):(\d{2}))?/);
        if (!match) return null;
        return new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3]),
            Number(match[4] || 0),
            Number(match[5] || 0)
        );
    }

    function showError(msg) {
        document.getElementById('contentArea').innerHTML = `<div class="status-box error-msg">⚠️ ${escapeHtml(msg)}</div>`;
    }

    function escapeHtml(value) {
        const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(value ?? '').replace(/[&<>"']/g, char => entities[char]);
    }

    function updateFontSize() { renderView(); }

    function openDateModal() {
        document.getElementById('dateRangeError').textContent = '';
        document.getElementById('dateModal').classList.add('is-open');
        document.getElementById('customStart').focus();
    }

    function closeDateModal() {
        document.getElementById('dateModal').classList.remove('is-open');
    }

    function applyCustomRange() {
        const start = parseDateInput(document.getElementById('customStart').value);
        const end = parseDateInput(document.getElementById('customEnd').value);
        const errorBox = document.getElementById('dateRangeError');

        if (!start || !end) {
            errorBox.textContent = '請選擇完整的開始及結束日期。';
            return;
        }
        if (end < start) {
            errorBox.textContent = '結束日期不可早於開始日期。';
            return;
        }

        const rangeDays = Math.floor((end - start) / 86400000) + 1;
        if (rangeDays > 730) {
            errorBox.textContent = '自訂範圍最多為 730 天。';
            return;
        }

        customRangeStart = start;
        customRangeEnd = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59, 999);
        viewMode = 'custom';
        closeDateModal();
        loadCurrentView();
    }

    function shiftDate(n) {
        if (viewMode === 'tenDays') {
            currentViewDate.setDate(currentViewDate.getDate() + (n * 10));
        } else if (viewMode === 'week') {
            currentViewDate.setDate(currentViewDate.getDate() + (n * 7));
        } else if (viewMode === 'month') {
            currentViewDate.setMonth(currentViewDate.getMonth() + n);
        } else {
            const rangeDays = Math.floor((customRangeEnd - customRangeStart) / 86400000) + 1;
            customRangeStart.setDate(customRangeStart.getDate() + (n * rangeDays));
            customRangeEnd.setDate(customRangeEnd.getDate() + (n * rangeDays));
            document.getElementById('customStart').value = formatDateParam(customRangeStart);
            document.getElementById('customEnd').value = formatDateParam(customRangeEnd);
        }
        loadCurrentView();
    }

    function goToToday() {
        currentViewDate = new Date();
        if (viewMode === 'custom') viewMode = 'tenDays';
        loadCurrentView();
    }

    function switchView(mode) {
        viewMode = mode;
        loadCurrentView();
    }

    function updateBtnStyle() {
        document.getElementById('btnTenDays').className = 'btn-sec';
        document.getElementById('btnWeek').className = 'btn-sec';
        document.getElementById('btnMonth').className = 'btn-sec';
        document.getElementById('btnCustom').className = 'btn-sec';
        if (viewMode === 'tenDays') {
            document.getElementById('btnTenDays').className = 'btn-sec btn-active';
        } else if (viewMode === 'week') {
            document.getElementById('btnWeek').className = 'btn-sec btn-active';
        } else if (viewMode === 'month') {
            document.getElementById('btnMonth').className = 'btn-sec btn-active';
        } else {
            document.getElementById('btnCustom').className = 'btn-sec btn-active';
        }
    }
    
    function formatDateSimple(date) { return `${date.getMonth() + 1}/${date.getDate()}`; }

    function formatDateFull(date) {
        return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}`;
    }

    function parseDateInput(value) {
        const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
        return date;
    }

    function formatDateParam(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    document.getElementById('dateModal').addEventListener('click', function(event) {
        if (event.target === this) closeDateModal();
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') closeDateModal();
    });
</script>

</body>
</html>
